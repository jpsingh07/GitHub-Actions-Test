name: Setup Java
on: workflow_dispatch
jobs:
  first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - run: javac ./Java/Test.java
      - run: java -cp ./Java/Test
